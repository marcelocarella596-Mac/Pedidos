<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parrilla La Perseverancia - Pedidos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#fff;padding-bottom:100px}
.banner-full{width:100%;height:180px;overflow:hidden;background:#000;position:relative}
.banner-full img{width:100%;height:100%;object-fit:cover;object-position:left center;display:block}
@media(max-width:600px){.banner-full{height:150px}.banner-full img{object-position:15% center}}

.header{padding:12px;text-align:center;background:#1a1a1a}
.header h1{font-size:20px;color:#ffcc00}
.header p{font-size:12px;opacity:.7}

.sug{padding:10px;background:#1a1a1a;margin:10px;border-radius:12px;border:1px solid #333}
.sug .t{font-weight:800;color:#ffcc00;margin-bottom:8px;font-size:14px}
.grid-h{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px;scroll-snap-type:x mandatory}
.grid-h::-webkit-scrollbar{display:none}
.card-h{min-width:150px;max-width:150px;background:#222;border-radius:10px;overflow:hidden;scroll-snap-align:start;border:1px solid #333}
.card-h .imgbox{width:100%;height:110px;background:#000;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-h .imgbox img{width:100%;height:100%;object-fit:cover}
.card-h .imgbox span{position:absolute;font-size:30px}
.card-h .b{padding:8px}
.card-h .n{font-size:12px;font-weight:700;height:30px}
.card-h .p{color:#ffcc00;font-weight:800;font-size:13px;margin:4px 0}
.ad{width:100%;background:#ffcc00;color:#000;border:none;padding:6px;border-radius:6px;font-weight:800;font-size:12px;cursor:pointer}

.cats{display:flex;gap:8px;padding:10px;overflow-x:auto;position:sticky;top:0;background:#111;z-index:10}
.cats::-webkit-scrollbar{display:none}
.cat{background:#222;border:1px solid #444;padding:6px 12px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.cat.active{background:#ffcc00;color:#000;border-color:#ffcc00;font-weight:800}

.menu{padding:10px;display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;background:#1e1e1e;padding:10px;border-radius:10px;border:1px solid #333}
.item .info{flex:1}
.item .name{font-size:14px;font-weight:700}
.item .price{font-size:13px;color:#ffcc00;margin-top:2px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:50%;border:none;background:#333;color:#fff;font-size:18px;cursor:pointer}
.qty button.plus{background:#ffcc00;color:#000}

.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;padding:12px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.cart-bar button{background:#25D366;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:800;cursor:pointer}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:30;padding:15px}
.modal-box{background:#222;width:100%;max-width:400px;border-radius:15px;padding:20px;border:1px solid #444}
.modal-box h3{text-align:center;margin-bottom:12px;color:#ffcc00}
.modal-box input,.modal-box select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #444;background:#111;color:#fff}
.modal-box .btns{display:flex;gap:10px;margin-top:12px}
.modal-box .btns button{flex:1;padding:12px;border-radius:8px;border:none;font-weight:800;cursor:pointer}
.cancel{background:#333;color:#fff}
.send{background:#25D366;color:#fff}
</style>
</head>
<body>

<div class="banner-full">
  <img src="parrilla_banner.jpeg" alt="Parrilla La Perseverancia">
</div>

<div class="header">
  <h1>🔥 PARRILLA LA PERSEVERANCIA</h1>
  <p>Av. Argentina 5801 - Envios a domicilio</p>
</div>

<!-- SUGERENCIAS CON FOTOS REALES -->
<div class="sug" id="sugerencias">
  <div class="t">🔥 SUGERENCIAS DE HOY - FOTOS REALES</div>
  <div class="grid-h">

    <div class="card-h">
      <div class="imgbox">
        <img src="sugerencias/fideos.jpg" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span style="display:none">🍝</span>
      </div>
      <div class="b">
        <div class="n">Fideos c/ Albóndigas</div>
        <div class="p">$14.000</div>
        <button class="ad" onclick="chg('fideosAlbon',1)">+ Agregar</button>
      </div>
    </div>

    <div class="card-h">
      <div class="imgbox">
        <img src="sugerencias/ravioles.jpg" onerror="this.style.display='none'">
      </div>
      <div class="b">
        <div class="n">Ravioles c/ Tuco</div>
        <div class="p">$14.000</div>
        <button class="ad" onclick="chg('ravioles',1)">+ Agregar</button>
      </div>
    </div>

    <div class="card-h">
      <div class="imgbox">
        <img src="sugerencias/bife.jpg" onerror="this.style.display='none'">
      </div>
      <div class="b">
        <div class="n">Bife Costilla c/ Fritas</div>
        <div class="p">$17.000</div>
        <button class="ad" onclick="chg('bifeCost',1)">+ Agregar</button>
      </div>
    </div>

    <div class="card-h">
      <div class="imgbox">
        <img src="sugerencias/ensalada.jpg" onerror="this.style.display='none'">
      </div>
      <div class="b">
        <div class="n">Ensalada Completa Pollo</div>
        <div class="p">$8.000</div>
        <button class="ad" onclick="chg('ensalCompleta',1)">+ Agregar</button>
      </div>
    </div>

    <div class="card-h">
      <div class="imgbox">
        <img src="sugerencias/asado.jpg" onerror="this.style.display='none'">
      </div>
      <div class="b">
        <div class="n">Asado c/ Fritas</div>
        <div class="p">$18.000</div>
        <button class="ad" onclick="chg('asado',1)">+ Agregar</button>
      </div>
    </div>

  </div>
</div>

<div class="cats" id="cats"></div>
<div class="menu" id="menu"></div>

<div class="cart-bar">
  <div><span id="cartCount">0 items</span> - <b id="cartTotal">$0</b></div>
  <button onclick="openModal()">Pedir por WhatsApp</button>
</div>

<div id="modal">
  <div class="modal-box">
    <h3>Finalizar Pedido</h3>
    <input id="nombre" placeholder="Tu nombre">
    <input id="direccion" placeholder="Dirección de entrega">
    <select id="pago">
      <option value="Efectivo">Efectivo</option>
      <option value="Transferencia">Transferencia</option>
      <option value="Mercado Pago">Mercado Pago</option>
    </select>
    <input id="obs" placeholder="Observaciones (opcional)">
    <div class="btns">
      <button class="cancel" onclick="closeModal()">Cancelar</button>
      <button class="send" onclick="enviar()">Enviar</button>
    </div>
  </div>
</div>

<script>
const productos = {
 fideosAlbon:{n:'Fideos c/ Albóndigas',p:14000,cat:'Pastas'},
 ravioles:{n:'Ravioles c/ Tuco',p:14000,cat:'Pastas'},
 bifeCost:{n:'Bife Costilla c/ Fritas',p:17000,cat:'Parrilla'},
 ensalCompleta:{n:'Ensalada Completa Pollo',p:8000,cat:'Ensaladas'},
 asado:{n:'Asado c/ Fritas',p:18000,cat:'Parrilla'},
 mila:{n:'Milanesa Gigante',p:14500,cat:'Parrilla'},
 milaNapo:{n:'Mila Napolitana',p:16000,cat:'Parrilla'},
 chuleta:{n:'Chuleta c/ Ensalada',p:15000,cat:'Parrilla'},
 tortilla:{n:'Tortilla Papas',p:6000,cat:'Guarniciones'},
 fritas:{n:'Papas Fritas',p:5000,cat:'Guarniciones'}
};

let cart = {};
let catActiva = 'Todos';

function init(){
  renderCats();
  renderMenu();
}
function renderCats(){
  const catsDiv = document.getElementById('cats');
  const todas = ['Todos', ...new Set(Object.values(productos).map(x=>x.cat))];
  catsDiv.innerHTML = todas.map(c=>`<div class="cat ${c===catActiva?'active':''}" onclick="filtrar('${c}')">${c}</div>`).join('');
}
function filtrar(c){
  catActiva=c; renderCats(); renderMenu();
}
function renderMenu(){
  const menuDiv = document.getElementById('menu');
  let html='';
  for(let id in productos){
    const pr = productos[id];
    if(catActiva!=='Todos' && pr.cat!==catActiva) continue;
    const q = cart[id]||0;
    html+=`<div class="item"><div class="info"><div class="name">${pr.n}</div><div class="price">$${pr.p.toLocaleString()}</div></div><div class="qty">${q>0?`<button onclick="chg('${id}',-1)">-</button><span>${q}</span>`:''}<button class="plus" onclick="chg('${id}',1)">+</button></div></div>`;
  }
  menuDiv.innerHTML=html;
  updateBar();
}
function chg(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  renderMenu();
}
function updateBar(){
  let tot=0,count=0;
  for(let id in cart){tot+=cart[id]*productos[id].p;count+=cart[id]}
  document.getElementById('cartCount').innerText=count+' items';
  document.getElementById('cartTotal').innerText='$'+tot.toLocaleString();
}
function openModal(){
  if(Object.keys(cart).length===0){alert('Carrito vacío');return}
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}

function enviar(){
  const nom = document.getElementById('nombre').value;
  const dir = document.getElementById('direccion').value;
  const pago = document.getElementById('pago').value;
  const obs = document.getElementById('obs').value;
  if(!nom||!dir){alert('Completá nombre y dirección');return}
  let msg=`*PEDIDO PARRILLA LA PERSEVERANCIA*%0A%0A`;
  let tot=0;
  for(let id in cart){
    const pr=productos[id];
    const sub=cart[id]*pr.p;
    tot+=sub;
    msg+=`• ${pr.n} x${cart[id]} - $${sub.toLocaleString()}%0A`;
  }
  msg+=`%0A*Total: $${tot.toLocaleString()}*%0A%0A`;
  msg+=`*Cliente:* ${nom}%0A*Dirección:* ${dir}%0A*Pago:* ${pago}%0A`;
  if(obs) msg+=`*Obs:* ${obs}%0A`;
  window.open(`https://wa.me/5491139525167?text=${msg}`,'_blank');
  closeModal();
}
init();
</script>
</body>
</html>
