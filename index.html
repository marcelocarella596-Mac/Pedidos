body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;padding-bottom:90px}

.tab.active{background:#fff;color:#000;border-color:#fff}
.grid{padding:6px 8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
@media(max-width:400px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#151515;border:1px solid #222;border-radius:10px;overflow:hidden;position:relative}

.card.info{padding:5px 6px}
.card.name{font-size:9px;font-weight:800;line-height:1.1;min-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.cat{font-size:7px;color:#666;text-transform:uppercase;margin-top:2px}
.card.foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}

.card.add{width:22px;height:22px;background:#ffcc00;color:#000;border:none;border-radius:50%;font-weight:900;font-size:12px;cursor:pointer}
.q{position:absolute;top:4px;right:4px;background:#ffcc00;color:#000;font-size:8px;font-weight:900;padding:2px 5px;border-radius:8px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;max-width:500px;margin:0 auto}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.box{background:#1a1a1a;width:100%;max-width:360px;border-radius:14px;padding:16px;border:1px solid #333}
.box input,.box select,.box textarea{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:12px}
.sum{background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px;margin:6px 0;font-size:10px;max-height:100px;overflow:auto}
.btns{display:flex;gap:6px;margin-top:8px}
.btns button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer}

<body>

<script>
