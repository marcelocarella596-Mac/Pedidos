</style></head><body>
<div class="banner"><img src="parrilla_banner.jpeg" onerror="this.src='https://images.unsplash.com/photo-1544025162-d76694265947?w=600'"></div><div class="stock-status" id="stockStatus">⏳ Verificando disponibilidad...</div><div class="carrusel-wrap"><div class="carrusel" id="carrusel"></div></div><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="cartbar" id="cartbar" style="display:none"><div><div id="cTot" style="font-size:10px;color:#888">0 items</div><b id="pTot">$0</b></div><button onclick="openM()" style="background:#25D366;color:#fff;border:none;padding:11px 18px;border-radius:11px;font-weight:900">PEDIR</button></div>
<div id="modal"><div class="box"><h3 style="text-align:center;font-size:14px;margin-bottom:10px">Finalizar pedido</h3><div class="sum" id="sum"></div><input id="nom" placeholder="Nombre *"><input id="dir" placeholder="Dirección *"><input id="tel" placeholder="Tel (opcional)"><select id="pago" onchange="checkPago()"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select><div class="alias" id="aliasBox"><b>ALIAS</b><br><span onclick="navigator.clipboard.writeText('Av.argentina')">Av.argentina</span></div><textarea id="obs" rows="2" placeholder="Observaciones"></textarea><div class="btns"><button onclick="closeM()" style="background:#2a2a2a;color:#fff">Cancelar</button><button id="btnEnviar" onclick="send()" style="background:#25D366;color:#fff">Enviar a cocina</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();
const MENU=[
{n:'Ravioles con Estofado',p:12500,cat:'pasta',img:'imagenes/ravioles_estofado.jpeg',real:true},{n:'Tallarines con Albóndigas',p:11500,cat:'pasta',img:'imagenes/tallarines_albondigas.jpeg',real:true},{n:'Albóndigas con Puré',p:10500,cat:'minuta',img:'imagenes/albondigas_pure.jpeg',real:true},{n:'Costillas a la Riojana',p:14500,cat:'minuta',img:'imagenes/costillas_riojana.jpeg',real:true},{n:'Milanesa con Fritas',p:14500,cat:'minuta',img:'imagenes/milanesa_fritas.jpeg',real:true},{n:'Churrasco con Papas',p:13500,cat:'minuta',img:'imagenes/churrasco_papas.jpeg',real:true},
{n:'Asado',p:12000,cat:'parrilla',img:'https://images.unsplash.com/photo-1546964052-d9333490c228?w=400'},{n:'Vacío',p:12500,cat:'parrilla',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=400'},{n:'Entraña',p:16000,cat:'parrilla',img:'https://images.unsplash.com/photo-1546964124-0c849213df27?w=400'},{n:'Bondiola',p:11000,cat:'parrilla',img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400'},{n:'Chorizo',p:4000,cat:'parrilla',img:'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=400'},{n:'Mollejas',p:11000,cat:'parrilla',img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=400'},{n:'Pollo 1/2',p:9000,cat:'parrilla',img:'https://images.unsplash.com/photo-1585328001270-0f0c67c0d06c?w=400'},{n:'Parrillada p/2',p:28000,cat:'parrilla',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=400'},{n:'Choripán',p:5000,cat:'sandwich',img:'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400'},{n:'Papas Fritas',p:5000,cat:'guarnicion',img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400'},{n:'Ensalada Mixta',p:6000,cat:'ensalada',img:'https://images.unsplash.com/photo-1512621776952-a57141f2eefd?w=400'},{n:'Coca 500ml',p:2500,cat:'bebida',img:'https://images.unsplash.com/photo-1554866585-cd94860890b7?w=400'},{n:'Quilmes 1L',p:5000,cat:'cerveza',img:'https://images.unsplash.com/photo-1608270586620-248524c67de9?w=400'},{n:'Flan',p:4000,cat:'postre',img:'https://images.unsplash.com/photo-1488477181946-64290103bbd6?w=400'}];
let cart={},cat='todos',stockAgotado={},stockListo=false,enviando=false;
const CATS=['todos','parrilla','pasta','minuta','sandwich','guarnicion','ensalada','bebida','cerveza','postre'];
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
const ALIAS_STOCK={'milanesaconfritas':'milanesacfritas','coca500ml':'cocacola500ml','flan':'flancasero'};
function clave(s){const k=norm(s);return ALIAS_STOCK[k]||k;}
function agotadoDirecto(n){const k=clave(n);return Object.entries(stockAgotado).some(([nombre,valor])=>!!valor&&clave(nombre)===k);}
const DEPENDENCIAS=[{principal:'Chorizo',productos:['Choripán','Choripán c/fritas']},{principal:'Morcilla',productos:['Morcipán']},{principal:'Vacío',productos:['Vacío sándwich','Vacío c/fritas']},{principal:'Bondiola',productos:['Bondiola sándwich','Bondiola c/fritas']},{principal:'Entraña',productos:['Entraña sándwich','Entraña c/fritas']}];
function motivoAgotado(n){if(agotadoDirecto(n))return n;const k=clave(n);const regla=DEPENDENCIAS.find(r=>r.productos.some(p=>clave(p)===k));return regla&&agotadoDirecto(regla.principal)?regla.principal:null;}
function agotado(n){return !!motivoAgotado(n);}
function renderTabs(){document.getElementById('tabs').innerHTML=CATS.map(c=>`<div class="tab ${cat===c?'active':''}" onclick="cat='${c}';renderTabs();renderGrid()">${c.toUpperCase()}</div>`).join('');}
function renderCarrusel(){document.getElementById('carrusel').innerHTML=MENU.filter(m=>m.real).map(m=>{const no=agotado(m.n);return `<div class="slide ${no?'agotado':''}" onclick="add(${JSON.stringify(m.n).replace(/"/g,'&quot;')})"><div class="slide-img"><img src="${m.img}"><div class="real-tag">REAL</div>${no?'<div class="agotado-label">AGOTADO</div>':''}</div><div class="slide-info"><b>${m.n}</b><span>${no?'SIN STOCK':'$'+m.p.toLocaleString()}</span></div></div>`;}).join('');}
function renderGrid(){const list=cat==='todos'?MENU:MENU.filter(m=>m.cat===cat);document.getElementById('grid').innerHTML=list.map(m=>{const q=cart[m.n]||0,no=agotado(m.n);return `<div class="card ${no?'agotado':''}" onclick="add(${JSON.stringify(m.n).replace(/"/g,'&quot;')})"><div class="card-img"><img src="${m.img}" onerror="this.style.display='none'"><div class="badge" style="display:${q?'block':'none'}">x${q}</div>${no?'<div class="agotado-label">AGOTADO</div>':''}</div><div class="card-info"><div class="card-name">${m.n}</div><div class="card-bottom"><div>${no?'SIN STOCK':'$'+m.p.toLocaleString()}</div><div>${no?'⛔':'+'}</div></div></div></div>`;}).join('');}
function add(n){if(!stockListo)return alert('Esperá la sincronización del stock');if(agotado(n))return alert(n+' AGOTADO (falta '+motivoAgotado(n)+')');cart[n]=(cart[n]||0)+1;upd();renderGrid();}
function upd(){let t=0,c=0;for(const k in cart){const p=MENU.find(x=>x.n===k);if(p){t+=p.p*cart[k];c+=cart[k];}}document.getElementById('cTot').innerText=c+' items';document.getElementById('pTot').innerText='$'+t.toLocaleString();document.getElementById('cartbar').style.display=c>0?'flex':'none';}
function checkPago(){document.getElementById('aliasBox').style.display=document.getElementById('pago').value!=='Efectivo'?'block':'none';}
function revisarCarrito(){return Object.keys(cart).filter(n=>cart[n]>0&&agotado(n));}
function openM(){if(!stockListo)return alert('Esperá la sincronización del stock');if(!Object.keys(cart).length)return alert('Carrito vacío');const faltan=revisarCarrito();if(faltan.length)return alert('Productos agotados: '+faltan.join(', '));let h='',t=0;for(const k in cart){const p=MENU.find(x=>x.n===k);if(!p)continue;t+=p.p*cart[k];h+=`${k} x${cart[k]}<br>`;}h+=`<br><b>Total $${t.toLocaleString()}</b>`;document.getElementById('sum').innerHTML=h;document.getElementById('modal').style.display='flex';checkPago();}
function closeM(){if(!enviando)document.getElementById('modal').style.display='none';}
function estadoStock(texto,color){const el=document.getElementById('stockStatus');el.textContent=texto;el.style.color=color;}
db.ref('platos_agotados').on('value',s=>{stockAgotado=s.val()||{};stockListo=true;estadoStock('● Stock actualizado en tiempo real','#2ecc71');renderGrid();renderCarrusel();},e=>{stockListo=false;estadoStock('⚠ Sin conexión al stock: pedidos deshabilitados','#ff6868');console.error(e);renderGrid();renderCarrusel();});
async function send(){if(enviando)return;const nom=document.getElementById('nom').value.trim(),dir=document.getElementById('dir').value.trim(),tel=document.getElementById('tel').value.trim(),pago=document.getElementById('pago').value,obs=document.getElementById('obs').value.trim();if(!nom||!dir)return alert('Falta nombre y dirección');if(!Object.keys(cart).length)return alert('Carrito vacío');if(!stockListo)return alert('Sin conexión al stock: no se puede enviar');
// Abrimos una pestaña en respuesta directa al clic para evitar bloqueo de ventanas emergentes.
const ventana=window.open('about:blank','_blank');enviando=true;const btn=document.getElementById('btnEnviar');btn.disabled=true;btn.textContent='Verificando stock...';
try{const snap=await db.ref('platos_agotados').once('value');stockAgotado=snap.val()||{};stockListo=true;renderGrid();renderCarrusel();const faltan=revisarCarrito();if(faltan.length)throw new Error('Se agotaron estos productos: '+faltan.join(', ')+'. Quitalos del carrito antes de enviar.');
let items=[],tot=0;const lineas=['*PEDIDO LA PERSEVERANCIA*',''];for(const k in cart){const p=MENU.find(x=>x.n===k);if(!p||!cart[k])continue;tot+=p.p*cart[k];lineas.push('• '+k+' x'+cart[k]);items.push({nombre:k,n:k,cantidad:cart[k],precio:p.p,p:p.p,cat:p.cat});}if(!items.length)throw new Error('Carrito vacío');lineas.push('','*Total: $'+tot.toLocaleString()+'*','*Cliente:* '+nom,'*Dir:* '+dir,'*Pago:* '+pago);if(obs)lineas.push('*Obs:* '+obs);
const shortId=Date.now().toString(),ahora=Date.now(),data={id:shortId,mesa:`WhatsApp ${shortId} - ${nom}`,mesaBase:'WhatsApp',canal:'WhatsApp',esWhatsApp:true,cliente:nom,direccion:dir,telefono:tel,pago,obs,items,itemsParrilla:items.filter(i=>['parrilla','minuta','sandwich'].includes(i.cat)),itemsCocina:items.filter(i=>!['parrilla','minuta','sandwich'].includes(i.cat)),total:tot,total_cobrado:tot,estado:'RECIBIDO',estado_mozo:'RECIBIDO',estado_parrilla:'RECIBIDO',estado_cocina:'RECIBIDO',roles:['Mozo','Parrilla','Cocina'],para:{Mozo:true,Parrilla:true,Cocina:true},emisor:'Web',hora:new Date().toLocaleTimeString().slice(0,5),timestamp:ahora};
await db.ref('comandas_activas/'+shortId).set(data);db.ref('mensajes').push({texto:`🟢 NUEVO ${shortId} - ${nom} $${tot.toLocaleString()}`,hora:data.hora,ts:ahora}).catch(console.error);
const url='https://wa.me/5491161698041?text='+encodeURIComponent(lineas.join('\n'));if(ventana&&!ventana.closed)ventana.location.href=url;else window.location.href=url;alert('✅ Pedido guardado en cocina. Se abrirá WhatsApp para enviar el mensaje.');cart={};upd();renderGrid();closeM();document.getElementById('modal').style.display='none';
}catch(e){if(ventana&&!ventana.closed)ventana.close();alert('❌ Pedido NO confirmado: '+e.message);}finally{enviando=false;btn.disabled=false;btn.textContent='Enviar a cocina';}}
renderTabs();renderCarrusel();renderGrid();
</script></body></html>
