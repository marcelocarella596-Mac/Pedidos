<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>La Perseverancia | Parrilla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
:root{--yellow:#ffcc00;--green:#25D366;--bg:#0f0f0f;--card:#1e1e1e}
body{background:var(--bg);color:#fff;padding-bottom:140px;max-width:480px;margin:0 auto;overflow-x:hidden}
.banner{width:100%;height:168px;position:relative;background:#000;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0f0f0f 5%,transparent 60%)}
.banner-logo{position:absolute;bottom:12px;left:14px;right:14px;z-index:2;display:flex;align-items:flex-end;gap:12px}
.banner-logo.logo{width:56px;height:56px;background:#111;border-radius:14px;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-size:28px}
.banner-logo h1{font-size:22px;font-weight:900;line-height:1}
.banner-logo p{font-size:11px;color:#ffcc00;font-weight:700;margin-top:2px}
.topbar{background:#1a1a1a;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.badge{position:absolute;top:-8px;right:-8px;background:var(--yellow);color:#000;font-size:10px;font-weight:900;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:2px solid #1a1a1a}
.tabs{display:flex;gap:8px;padding:12px 12px 4px;overflow-x:auto;background:var(--bg)}
.tab{padding:8px 16px;border-radius:20px;background:#2a2a2a;color:#999;font-size:12px;white-space:nowrap;font-weight:700;cursor:pointer;border:1px solid #333}
.tab.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.section{padding:16px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.grid{padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid #2a2a2a;position:relative}
.card.pic{width:100%;height:126px;overflow:hidden;background:#222;position:relative}
.card.pic img{width:100%;height:100%;object-fit:cover}
.card.info{padding:10px}
.card.name{font-size:12px;font-weight:800;min-height:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.desc{font-size:10px;color:#888;min-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.card.price{font-weight:900;font-size:13px}
.card.price b{color:var(--yellow)}
.card.add{width:30px;height:30px;background:#fff;color:#000;border:none;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;font-weight:900}
.card.qty-badge{position:absolute;top:8px;right:8px;background:var(--yellow);color:#000;font-size:11px;font-weight:900;padding:4px 8px;border-radius:20px}
.cartbar{position:fixed;bottom:62px;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto;z-index:29;border-radius:16px 16px 0 0}
.btn-wa{background:var(--green);color:#fff;border:none;padding:12px 18px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #2a2a2a;display:flex;justify-content:space-around;padding:8px 0 12px;max-width:480px;margin:0 auto}
.bottom div{display:flex;flex-direction:column;align-items:center;font-size:9px;color:#666;font-weight:700}
.bottom div.active{color:var(--yellow)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:50}
.box{background:#1e1e1e;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px;border-top:1px solid #333}
.box input,.box select,.box textarea{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #333;background:#111;color:#fff}
.summary{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin:10px 0;font-size:12px;max-height:140px;overflow:auto}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="banner"><img src="parrilla_banner.jpeg" onerror="this.src='https://images.unsplash.com/photo-1558030006-450066393d65?w=800'"><div class="banner-logo"><div class="logo">🔥</div><div><h1>LA PERSEVERANCIA</h1><p>Parrilla • Desde 1987</p></div></div></div>
<div class="topbar"><div>☰ <b>La Perseverancia</b> <span style="background:#ffcc00;color:#000;font-size:9px;padding:2px 6px;border-radius:6px;font-weight:900">ABIERTO</span></div><div style="position:relative">🛒<div class="badge" id="badge" style="display:none">0</div></div></div>
<div class="tabs" id="tabs"></div>
<div class="section"><h2>🔥 Menú destacado</h2><a onclick="catAct='Todos';renderTabs();renderGrid()">Ver todo ›</a></div>
<div class="grid" id="grid"></div>
<div class="cartbar" id="cartbar" style="display:none"><div><div id="cTot">0 items</div><b id="pTot" style="color:#ffcc00">$0</b></div><button class="btn-wa" onclick="openM()">🟢 Pedir por WhatsApp</button></div>
<div class="bottom"><div class="active"><span>🏠</span>Inicio</div><div><span>🔍</span>Buscar</div><div onclick="openM()"><span>🛒</span>Pedidos</div><div><span>♡</span>Fav</div><div><span>👤</span>Perfil</div></div>
<div id="modal"><div class="box"><h3>Finalizar pedido 📦</h3><div class="summary" id="sum"></div><input id="nom" placeholder="Tu nombre *"><input id="dir" placeholder="Dirección *"><input id="tel" placeholder="WhatsApp"><select id="pago"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select><textarea id="obs" placeholder="Observaciones"></textarea><div class="btns"><button onclick="closeM()" style="background:#333;color:#fff">Cancelar</button><button onclick="send()" style="background:#25D366;color:#fff">Enviar 🟢</button></div><div style="font-size:10px;color:#666;text-align:center;margin-top:10px">Entra directo a cocina para Gustavo, Mariana y Hernan</div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const prods=[
{id:'entrana',n:'Entraña a la Parrilla',d:'300g • jugoso • a la parrilla',p:12990,cat:'Parrilla',img:'https://images.unsplash.com/photo-1546964052-d9333490c228?w=400'},
{id:'chorizo',n:'Chorizo Artesanal',d:'Pack 4 unidades • especiado',p:8490,cat:'Parrilla',img:'https://images.unsplash.com/photo-1583981720956-9b2b0e3a6a9b?w=400'},
{id:'papas',n:'Papas Fritas Crocantes',d:'Porción grande • sal & perejil',p:4990,cat:'Guarniciones',img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400'},
{id:'molleja',n:'Molleja a la Parrilla',d:'200g • limón & chimichurri',p:10990,cat:'Parrilla',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=400'},
{id:'bifeCho',n:'Bife de Chorizo',d:'350g • guarnición',p:32000,cat:'Parrilla',img:'https://images.unsplash.com/photo-1546964124-0c849213df27?w=400'},
{id:'asadoTira',n:'Asado de Tira',d:'500g • cocción lenta',p:26500,cat:'Parrilla',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=400'},
{id:'vacio',n:'Vacío',d:'Vacío • 400g',p:12500,cat:'Parrilla',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=400'},
{id:'bondiola',n:'Bondiola',d:'Bondiola • 350g',p:11000,cat:'Parrilla',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=400'},
{id:'coca500',n:'Coca Cola 500ml',d:'Bebida fría',p:2500,cat:'Bebidas',img:'https://images.unsplash.com/photo-1554866585-cd94860890b7?w=400'},
{id:'provoleta',n:'Provoleta',d:'Provo • chimi',p:13000,cat:'Entradas',img:'https://images.unsplash.com/photo-1548340748-3a624a8b7cb2?w=400'},
{id:'flan',n:'Flan casero',d:'Flan + dulce + crema',p:4000,cat:'Postres',img:'https://images.unsplash.com/photo-1488477181946-64290103bbd6?w=400'},
{id:'combo2',n:'Combo p/2',d:'Asado, vacío, chori, morci',p:28000,cat:'Combos',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=400'},
];
let cart={},catAct='Parrilla';
function renderTabs(){const cats=['Todos','Parrilla','Bebidas','Entradas','Guarniciones','Postres','Combos'];document.getElementById('tabs').innerHTML=cats.map(c=>`<div class="tab ${c===catAct?'active':''}" onclick="catAct='${c}';renderTabs();renderGrid()">${c}</div>`).join('');}
function renderGrid(){const list=catAct==='Todos'?prods:prods.filter(x=>x.cat===catAct);const show=list.length?list:prods;document.getElementById('grid').innerHTML=show.map(p=>{const q=cart[p.id]||0;return `<div class="card" onclick="add('${p.id}')"><div class="pic"><img src="${p.img}">${q?`<div class="qty-badge">x${q}</div>`:''}</div><div class="info"><div class="name">${p.n}</div><div class="desc">${p.d}</div><div class="foot"><div class="price">$<b>${p.p.toLocaleString()}</b></div><button class="add">+</button></div></div></div>`}).join('');}
function add(id){cart[id]=(cart[id]||0)+1;upd();renderGrid()}
function upd(){let t=0,c=0;for(let k in cart){const p=prods.find(x=>x.id===k);if(p){t+=p.p*cart[k];c+=cart[k]}}document.getElementById('cTot').innerText=c+' items';document.getElementById('pTot').innerText='$'+t.toLocaleString();const b=document.getElementById('badge');const bar=document.getElementById('cartbar');if(c>0){b.style.display='flex';b.innerText=c;bar.style.display='flex'}else{b.style.display='none';bar.style.display='none'}}
function openM(){if(!Object.keys(cart).length)return alert('Carrito vacío');let html='',tot=0;for(let k in cart){const p=prods.find(x=>x.id===k);if(!p)continue;tot+=p.p*cart[k];html+=`• ${p.n} x${cart[k]}<br>`}html+=`<br><b style="color:#ffcc00">Total: $${tot.toLocaleString()}</b>`;document.getElementById('sum').innerHTML=html;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function send(){const nom=document.getElementById('nom').value.trim(),dir=document.getElementById('dir').value.trim(),tel=document.getElementById('tel').value.trim(),pago=document.getElementById('pago').value,obs=document.getElementById('obs').value.trim();if(!nom||!dir)return alert('Falta nombre y dir');let items=[],msg=`*PEDIDO LA PERSEVERANCIA*%0A%0A`,tot=0;for(let k in cart){const p=prods.find(x=>x.id===k);if(!p)continue;tot+=p.p*cart[k];msg+=`• ${p.n} x${cart[k]} - $${(p.p*cart[k]).toLocaleString()}%0A`;items.push({n:p.n,nombre:p.n,cantidad:cart[k],p:p.p,precio:p.p,cat:p.cat.toLowerCase(),sub:p.cat});}msg+=`%0A*Total: $${tot.toLocaleString()}*%0A*Cliente:* ${nom}%0A*Dir:* ${dir}`;const shortId=Date.now().toString().slice(-4);const key=`Canal - WhatsApp #${shortId} - ${nom}`;db.ref('comandas_activas/'+key).set({mesa:key,mesaBase:'Canal - WhatsApp',canal:'Canal - WhatsApp',cliente:nom,direccion:dir,telefono:tel,pago:pago,obs:obs,items:items,total:tot,total_cobrado:tot,estado:'RECIBIDO',estado_parrilla:'RECIBIDO',estado_cocina:'RECIBIDO',emisor:'Cliente Web',hora:new Date().toLocaleTimeString().slice(0,5),timestamp:Date.now(),timestamp_estado:Date.now(),id:Date.now(),origen:'web_pedidos'}).then(()=>{db.ref('mensajes').push({emisor:'WEB',texto:`🟢 WHATSAPP #${shortId} - ${nom} - $${tot.toLocaleString()}`,hora:new Date().toLocaleTimeString().slice(0,5),ts:Date.now(),destino:'todos'});});window.open(`https://wa.me/5491140434137?text=${msg}`,'_blank');cart={};upd();renderGrid();closeM();}
renderTabs();renderGrid();
</script>
</body>
</html>
