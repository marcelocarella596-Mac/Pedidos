<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Perseverancia</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;padding-bottom:90px}
.banner{width:100%;height:180px;background:#111;position:relative;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#0a0a0a;position:sticky;top:0;z-index:5;border-bottom:1px solid #1a1a1a}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:20px;background:#1a1a1a;color:#777;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid #222;cursor:pointer;letter-spacing:0.3px}
.tab.active{background:#fff;color:#000;border-color:#fff}
/* SUGERENCIA FUMÉ - NO AMARILLO */
.suge{margin:10px 12px;background:#151515;border:1px solid #2a2a2a;border-radius:12px;display:flex;overflow:hidden;cursor:pointer}
.suge-img{width:92px;height:82px;background:#0f0f0f;flex-shrink:0}
.suge-img img{width:100%;height:100%;object-fit:cover;display:block}
.suge-txt{flex:1;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.suge-txt b{font-size:12px;font-weight:800;color:#fff}
.suge-txt span{font-size:10px;color:#888;margin-top:2px;line-height:1.2}
.suge-txt i{font-size:11px;color:#ffcc00;font-style:normal;font-weight:800;margin-top:4px}
.suge-add{width:70px;display:flex;align-items:center;justify-content:center;border-left:1px solid #222}
.suge-add em{font-style:normal;font-size:10px;font-weight:900;background:#222;color:#fff;padding:6px 10px;border-radius:20px}
/* GRID PAREJO */
.grid{padding:6px 8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#151515;border:1px solid #1e1e1e;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;height:148px}
.card-img{width:100%;height:78px;background:#1e1e1e;flex-shrink:0;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1e1e1e;color:#333;font-size:18px}
.card-info{flex:1;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between}
.card-name{font-size:10px;font-weight:700;line-height:1.15;min-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#ddd}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.card-price{font-size:11px;font-weight:900;color:#fff}
.card-add{width:22px;height:22px;background:#ffcc00;color:#000;border:none;border-radius:50%;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.badge{position:absolute;top:5px;right:5px;background:#ffcc00;color:#000;font-size:8px;font-weight:900;padding:2px 6px;border-radius:10px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;max-width:500px;margin:0 auto;z-index:20}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.box{background:#181818;width:100%;max-width:360px;border-radius:14px;padding:16px;border:1px solid #2a2a2a}
.box input,.box select,.box textarea{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff;font-size:12px}
.sum{background:#0f0f0f;border:1px solid #1e1e1e;border-radius:9px;padding:8px;margin:6px 0;font-size:10px;max-height:100px;overflow:auto}
.btns{display:flex;gap:6px;margin-top:10px}
.btns button{flex:1;padding:11px;border:none;border-radius:9px;font-weight:900;font-size:11px;cursor:pointer}
.alias{background:#ffcc00;color:#000;border-radius:9px;padding:10px;text-align:center;margin:8px 0;display:none}
.alias b{font-size:10px;display:block}
.alias span{font-size:15px;font-weight:900;background:#000;color:#ffcc00;padding:4px 12px;border-radius:7px;display:inline-block;margin-top:4px}
</style>
</head>
<body>
<!-- BANNER LIMPIO CON FONDO NOMBRE -->
<div class="banner"><img src="parrilla_banner.jpeg" onerror="this.src='https://images.unsplash.com/photo-1544025162-d76694265947?w=500&q=60'"></div>

<!-- SUGERENCIA FUME - NO AMARILLO -->
<div class="suge" onclick="addSug()">
<div class="suge-img"><img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=300&q=70" onerror="this.parentNode.innerHTML='<div class=ph>🍝</div>'"></div>
<div class="suge-txt"><b>Ravioles con Estofado</b><span>Sugerencia del día • casero y abundante</span><i>$12.500 • con pan</i></div>
<div class="suge-add"><em>AGREGAR</em></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="cartbar" id="cartbar" style="display:none"><div><div id="cTot" style="font-size:10px;color:#777">0 items</div><b id="pTot" style="font-size:12px">$0</b></div><button onclick="openM()" style="background:#25D366;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:900;font-size:11px">PEDIR</button></div>

<div id="modal"><div class="box"><h3 style="text-align:center;font-size:13px;margin-bottom:8px;color:#fff">Finalizar pedido</h3><div class="sum" id="sum"></div><input id="nom" placeholder="Nombre *"><input id="dir" placeholder="Dirección *"><select id="pago" onchange="checkPago()"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select><div class="alias" id="aliasBox"><b>ALIAS TRANSFERENCIA</b><span onclick="navigator.clipboard.writeText('Av.argentina')">Av.argentina</span><div style="font-size:8px;margin-top:4px">Tocá para copiar</div></div><textarea id="obs" rows="2" placeholder="Observaciones"></textarea><div class="btns"><button onclick="closeM()" style="background:#2a2a2a;color:#fff">Cancelar</button><button onclick="send()" style="background:#25D366;color:#fff">Enviar a cocina</button></div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAvrpQSDoq9S87j3J7V4-uhJnPFCylCU",authDomain:"parrilla-la-perseveranci-f3f54.firebaseapp.com",databaseURL:"https://parrilla-la-perseveranci-f3f54-default-rtdb.firebaseio.com",projectId:"parrilla-la-perseveranci-f3f54"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const MENU=[
{n:'Asado',p:12000,cat:'parrilla',img:'https://images.unsplash.com/photo-1546964052-d9333490c228?w=300&q=70'},
{n:'Vacío',p:12500,cat:'parrilla',img:'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=300&q=70'},
{n:'Entraña',p:16000,cat:'parrilla',img:'https://images.unsplash.com/photo-1546964052-d9333490c228?w=300&q=70'},
{n:'Bondiola',p:11000,cat:'parrilla',img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&q=70'},
{n:'Chorizo',p:4000,cat:'parrilla',img:'https://images.unsplash.com/photo-1583981720956-9b2b0e3a6a9b?w=300&q=70'},
{n:'Mollejas',p:11000,cat:'parrilla',img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=300&q=70'},
{n:'Pollo 1/2',p:9000,cat:'parrilla',img:'https://images.unsplash.com/photo-1585328001270-0f0c67c0d06c?w=300&q=70'},
{n:'Parrillada p/2',p:28000,cat:'parrilla',img:'https://images.unsplash.com/photo-1558030006-450066393d65?w=300&q=70'},
{n:'Choripán',p:5000,cat:'sandwich',img:'https://images.unsplash.com/photo-1521390188846-e2a3a97453a0?w=300&q=70'},
{n:'Bondiola sánd',p:8500,cat:'sandwich',img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=300&q=70'},
{n:'Hamburguesa',p:6000,cat:'sandwich',img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=300&q=70'},
{n:'Provoleta',p:13000,cat:'minuta',img:'https://images.unsplash.com/photo-1548340748-3a624a8b7cb2?w=300&q=70'},
{n:'Milanesa',p:14500,cat:'minuta',img:'https://images.unsplash.com/photo-1574653853015-5382a2f7a1af?w=300&q=70'},
{n:'Ravioles c/estofado',p:12500,cat:'minuta',img:'https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=300&q=70'},
{n:'Papas Fritas',p:5000,cat:'guarnicion',img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300&q=70'},
{n:'Ensalada Mixta',p:6000,cat:'ensalada',img:'https://images.unsplash.com/photo-1512621776952-a57141f2eefd?w=300&q=70'},
{n:'Coca 500ml',p:2500,cat:'bebida',img:'https://images.unsplash.com/photo-1554866585-cd94860890b7?w=300&q=70'},
{n:'Quilmes 1L',p:5000,cat:'cerveza',img:'https://images.unsplash.com/photo-1608270586620-248524c67de9?w=300&q=70'},
{n:'Flan',p:4000,cat:'postre',img:'https://images.unsplash.com/photo-1488477181946-64290103bbd6?w=300&q=70'},
];
let cart={},cat='todos';
const CATS=['todos','parrilla','sandwich','minuta','guarnicion','bebida','postre'];
function renderTabs(){document.getElementById('tabs').innerHTML=CATS.map(c=>`<div class="tab ${cat===c?'active':''}" onclick="cat='${c}';renderTabs();renderGrid()">${c.toUpperCase()}</div>`).join('');}
function renderGrid(){let list=cat==='todos'?MENU:MENU.filter(m=>m.cat===cat);document.getElementById('grid').innerHTML=list.map(m=>{const q=cart[m.n]||0;return `<div class="card" onclick="add('${m.n}')"><div class="card-img"><img src="${m.img}" loading="lazy" onerror="this.style.display='none'"><div class="badge" style="display:${q?'block':'none'}">x${q}</div></div><div class="card-info"><div class="card-name">${m.n}</div><div class="card-bottom"><div class="card-price">$${m.p.toLocaleString()}</div><button class="card-add">+</button></div></div></div>`}).join('');}
function add(n){cart[n]=(cart[n]||0)+1;upd();renderGrid();}
function upd(){let t=0,c=0;for(let k in cart){const p=MENU.find(x=>x.n===k);if(p){t+=p.p*cart[k];c+=cart[k];}}document.getElementById('cTot').innerText=c+' items';document.getElementById('pTot').innerText='$'+t.toLocaleString();document.getElementById('cartbar').style.display=c>0?'flex':'none';}
function addSug(){cart['Ravioles c/estofado']=(cart['Ravioles c/estofado']||0)+1;upd();renderGrid();}
function checkPago(){const v=document.getElementById('pago').value;document.getElementById('aliasBox').style.display=(v==='Transferencia' || v==='Mercado Pago')?'block':'none';}
function openM(){if(!Object.keys(cart).length)return alert('Carrito vacío');let h='',t=0;for(let k in cart){const p=MENU.find(x=>x.n===k);if(!p)continue;t+=p.p*cart[k];h+=`${k} x${cart[k]}<br>`}h+=`<br><b style="color:#fff">Total $${t.toLocaleString()}</b>`;document.getElementById('sum').innerHTML=h;document.getElementById('modal').style.display='flex';checkPago();}
function closeM(){document.getElementById('modal').style.display='none';}
function send(){
 const nom=document.getElementById('nom').value.trim();
 const dir=document.getElementById('dir').value.trim();
 const pago=document.getElementById('pago').value;
 const obs=document.getElementById('obs').value.trim();
 if(!nom||!dir){alert('Falta nombre y dirección');return;}
 let items=[],tot=0,msg=`*PEDIDO LA PERSEVERANCIA*%0A%0A`;
 for(let k in cart){const p=MENU.find(x=>x.n===k);if(!p)continue;tot+=p.p*cart[k];msg+=`• ${k} x${cart[k]}%0A`;items.push({n:k,nombre:k,cantidad:cart[k],p:p.p,precio:p.p,cat:p.cat,sub:p.cat});}
 msg+=`%0A*Total: $${tot.toLocaleString()}*%0A*Cliente:* ${nom}%0A*Dir:* ${dir}%0A*Pago:* ${pago}%0A${pago==='Transferencia'?`*Alias: Av.argentina*%0A`:''}${obs?`*Obs:* ${obs}`:''}`;
 const shortId=Date.now().toString().slice(-4);
 const key=`Canal - WhatsApp #${shortId} - ${nom}`;
 const data={mesa:key,mesaBase:'Canal - WhatsApp',canal:'Canal - WhatsApp',cliente:nom,direccion:dir,pago:pago,alias:pago==='Transferencia'?'Av.argentina':'',obs:obs,items:items,total:tot,total_cobrado:tot,estado:'RECIBIDO',estado_parrilla:'RECIBIDO',estado_cocina:'RECIBIDO',emisor:'Cliente Web',hora:new Date().toLocaleTimeString().slice(0,5),timestamp:Date.now(),timestamp_estado:Date.now(),id:Date.now()};
 const waUrl=`https://wa.me/5491140434137?text=${msg}`;
 window.open(waUrl,'_blank');
 db.ref('comandas_activas/'+key).set(data).then(()=>{db.ref('mensajes').push({emisor:'WEB',texto:`🟢 #${shortId} - ${nom} $${tot.toLocaleString()}`,hora:new Date().toLocaleTimeString().slice(0,5),ts:Date.now(),destino:'todos'});});
 cart={};upd();renderGrid();closeM();
}
renderTabs();renderGrid();
</script>
</body>
</html>
